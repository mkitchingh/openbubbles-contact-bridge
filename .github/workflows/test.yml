name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dart:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - name: Install pinned ObjectBox native library
        shell: bash
        run: bash <(curl -fsSL https://raw.githubusercontent.com/objectbox/objectbox-dart/v4.0.3/install.sh)
      - run: dart analyze --fatal-infos
      - run: dart test
      - name: Test Windows discovery
        shell: powershell
        run: ./test/Discovery.SelfTest.ps1
